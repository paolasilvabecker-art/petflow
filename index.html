      <div class="card pad-md">
        ${pets.map(p=>`<div class="reg-row" style="cursor:pointer;" data-action="nav" data-view="tutor-pet-detail" data-pet-id="${p.id}"><span class="reg-ic" style="background:${SPECIES_COLOR[p.species]};">${SPECIES_EMOJI[p.species]}</span><div style="flex:1;"><b style="font-size:13.5px;">${p.name}</b></div>${ic('chevronRight','icon-sm')}</div>`).join('')}
      </div>

      <div class="section-title"><h2>Notificações</h2></div>
      <div class="card pad-md">
        <div class="settings-row" style="padding:12px 0;"><div class="st-l"><b>Lembretes de vacina</b><span>Avisar sobre vacinas a vencer</span></div><div class="switch on" data-action="toggle-switch"></div></div>
        <div class="settings-row" style="padding:12px 0;"><div class="st-l"><b>Confirmação de consulta</b><span>Avisar quando confirmada</span></div><div class="switch on" data-action="toggle-switch"></div></div>
      </div>

      <button class="btn btn-ghost btn-block" style="margin-top:24px;color:var(--danger);" data-action="logout">${ic('logout','icon-sm')}Sair da demonstração</button>
    </div>
  `;
}
/* ===================== EVENTOS ===================== */
function bindGlobalEvents(){}
function bindModalEvents(){}

function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function num(id){ const v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }

/* ---------- Proteção contra perda de dados em modais + trava de duplo clique ---------- */
let MODAL_DIRTY = false;
let SAVE_LOCK = false;

function doCloseModal(){
  MODAL_DIRTY = false;
  STATE.confirmDiscard = false;
  DRAFT_AT = null; DRAFT_RX = null; DRAFT_PAY = null;
  closeModal();
}
function attemptCloseModal(){
  if(MODAL_DIRTY){ STATE.confirmDiscard = true; render(); }
  else doCloseModal();
}
function rerenderModalPreserveScroll(){
  const mb = document.querySelector('.modal-body');
  const scrollTop = mb ? mb.scrollTop : 0;
  render();
  const mb2 = document.querySelector('.modal-body');
  if(mb2) mb2.scrollTop = scrollTop;
}
/* Mostra um aviso de erro de gravação e mantém o modal aberto (não perde
   o que já foi digitado), soltando a trava de duplo clique. */
function reportSaveError(err){
  console.error('[PetFlow] Erro ao salvar:', err);
  showToast('Não foi possível salvar: ' + (err && err.message ? err.message : 'tente novamente.'), 'warn');
  SAVE_LOCK = false;
  render();
}
function remoteReady(){ return (typeof SUPABASE_CONFIGURED !== 'undefined') && SUPABASE_CONFIGURED; }

document.addEventListener('input', function(e){
  if(e.target.closest && e.target.closest('.modal')) MODAL_DIRTY = true;
});
document.addEventListener('change', function(e){
  if(e.target.closest && e.target.closest('.modal')) MODAL_DIRTY = true;
  const fileInput = e.target.closest && e.target.closest('[data-photo-upload]');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const kind = fileInput.dataset.photoUpload;
    const id = kind==='pet' ? fileInput.dataset.petId : fileInput.dataset.tutorId;
    if(typeof handlePhotoUpload === 'function') handlePhotoUpload(kind, id, fileInput.files[0]);
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(STATE.confirmDeletePetId){ e.preventDefault(); STATE.confirmDeletePetId = null; render(); return; }
    if(STATE.modal){
      e.preventDefault();
      if(STATE.confirmDiscard){ STATE.confirmDiscard = false; render(); }
      else attemptCloseModal();
    }
  }
});

/* ---------- Arrastar e soltar consultas na agenda ---------- */
let DRAG_APPT_ID = null;
document.addEventListener('dragstart', function(e){
  const card = e.target.closest('[data-drag-appt]');
  if(card){ DRAG_APPT_ID = card.dataset.dragAppt; if(e.dataTransfer){ e.dataTransfer.setData('text/plain', DRAG_APPT_ID); e.dataTransfer.effectAllowed='move'; } }
});
document.addEventListener('dragover', function(e){
  const cell = e.target.closest('[data-drop-slot]');
  if(cell){ e.preventDefault(); cell.classList.add('drag-over'); }
});
document.addEventListener('dragleave', function(e){
  const cell = e.target.closest('[data-drop-slot]');
  if(cell) cell.classList.remove('drag-over');
});
document.addEventListener('drop', async function(e){
  const cell = e.target.closest('[data-drop-slot]');
  if(!cell) return;
  e.preventDefault();
  cell.classList.remove('drag-over');
  const apptId = DRAG_APPT_ID || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  DRAG_APPT_ID = null;
  if(!apptId) return;
  const date = cell.dataset.date, time = cell.dataset.time;
  if(!isSlotFree(date, time, apptId)){ showToast('Esse horário não está disponível.', 'warn'); return; }
  const a = DB.appointments.find(x=>x.id===apptId);
  if(!a) return;
  const prevDate = a.date, prevTime = a.time;
  a.date = date; a.time = time; render();
  if(remoteReady()){
    try{ await dbUpdateAppointment(apptId, {date, time}); showToast(`Consulta reagendada para ${fmtDateShort(date)} às ${time}.`); }
    catch(err){ a.date = prevDate; a.time = prevTime; reportSaveError(err); }
  } else {
    showToast(`Consulta reagendada para ${fmtDateShort(date)} às ${time}.`);
  }
});

document.addEventListener('click', async function(e){
  const actionEl = e.target.closest('[data-action]');
  if(!actionEl) return;
  const action = actionEl.dataset.action;
  const d = actionEl.dataset;

  if(action==='close-modal-bg'){
    if(e.target.closest('[data-modal-inner]')) return;
    attemptCloseModal(); return;
  }

  switch(action){
    case 'confirm-keep-editing': STATE.confirmDiscard = false; render(); break;
    case 'confirm-discard-close': doCloseModal(); break;

    case 'login': doLogin(d.role); break;
    case 'logout': isSupabaseConfigured() && typeof handleRealLogout==='function' ? handleRealLogout() : doLogout(); break;

    case 'login-tab': STATE.loginTab = d.tab; STATE.authError = null; render(); break;
    case 'toggle-signup': STATE.signupMode = !STATE.signupMode; STATE.authError = null; render(); break;
    case 'do-real-login': {
      const email = val('auth_email'), password = val('auth_password');
      if(!email || !password){ STATE.authError = 'Preencha e-mail e senha.'; render(); break; }
      if(typeof handleRealLogin === 'function') handleRealLogin(d.role, email, password);
      break;
    }
    case 'do-signup': {
      const email = val('auth_email'), password = val('auth_password'), name = val('auth_name'), phone = val('auth_phone');
      if(d.role === 'vet'){
        const crmv = val('auth_crmv'), clinic = val('auth_clinic');
        if(!email || !password || !name){ STATE.authError = 'Preencha nome, e-mail e senha.'; render(); break; }
        if(typeof handleVetSignup === 'function') handleVetSignup(email, password, name, crmv, clinic, phone);
      } else {
        if(!email || !password || !name){ STATE.authError = 'Preencha nome, e-mail e senha.'; render(); break; }
        if(typeof handleTutorSignup === 'function') handleTutorSignup(email, password, name, phone);
      }
      break;
    }

    case 'nav': navigate(d.view, { petId: d.petId, tutorId: d.tutorId }); break;

    case 'open-atendimento': DRAFT_AT = freshDraftAt(d.petId); MODAL_DIRTY=false; openModal('atendimento', {petId: d.petId}); break;
    case 'open-receita': DRAFT_RX = freshDraftRx(d.petId); MODAL_DIRTY=false; openModal('receita', {petId: d.petId}); break;
    case 'open-exame': MODAL_DIRTY=false; openModal('exame', {petId: d.petId}); break;
    case 'open-vacina': MODAL_DIRTY=false; openModal('vacina', {petId: d.petId}); break;
    case 'open-concluir-exame': MODAL_DIRTY=false; openModal('concluir-exame', {examId: d.examId}); break;
    case 'open-novo-pet': MODAL_DIRTY=false; openModal('novo-pet', {}); break;
    case 'open-novo-pet-tutor': MODAL_DIRTY=false; openModal('novo-pet-tutor', {}); break;
    case 'open-novo-tutor': MODAL_DIRTY=false; openModal('novo-tutor', {}); break;
    case 'open-edit-pet': MODAL_DIRTY=false; openModal('edit-pet', {petId: d.petId}); break;
    case 'open-timeline-detail': openModal('timeline-detail', {type: d.type, id: d.id}); break;
    case 'toggle-notif': openModal('notifications', {}); break;
    case 'open-recusar-agendamento': MODAL_DIRTY=false; openModal('recusar-agendamento', {apptId: d.apptId}); break;
    case 'open-registrar-pagamento': DRAFT_PAY = null; MODAL_DIRTY=false; openModal('registrar-pagamento', {payIds: d.payIds.split(','), label: d.contextLabel||''}); break;
    case 'open-pagar-tutor': {
      const f = tutorFinance(d.tutorId);
      DRAFT_PAY = null; MODAL_DIRTY=false;
      openModal('registrar-pagamento', {payIds: f.allPendingIds, label: getTutor(d.tutorId).name});
      break;
    }
    case 'open-pagar-pet': {
      const f = petFinance(d.petId);
      const ids = f.list.filter(p=>p.status==='Pendente').map(p=>p.id);
      DRAFT_PAY = null; MODAL_DIRTY=false;
      openModal('registrar-pagamento', {payIds: ids, label: getPet(d.petId).name});
      break;
    }

    /* --- Agenda: calendário --- */
    case 'open-agenda-detail': MODAL_DIRTY=false; openModal('agenda-detail', {apptId: d.apptId}); break;
    case 'open-novo-agendamento': MODAL_DIRTY=false; openModal('novo-agendamento', {petId: d.petId, date: d.date2, time: d.time2}); break;
    case 'open-gerenciar-disponibilidade': MODAL_DIRTY=false; openModal('gerenciar-disponibilidade', {date: d.date}); break;
    case 'cal-goto-day': STATE.agenda.view='dia'; STATE.agenda.anchorDate=d.date; render(); break;
    case 'cal-view': STATE.agenda.view = d.view; render(); break;
    case 'cal-today': STATE.agenda.anchorDate = NOW_ISO_DATE; render(); break;
    case 'cal-prev': {
      const v = STATE.agenda.view;
      STATE.agenda.anchorDate = v==='mes' ? isoAddDays(STATE.agenda.anchorDate, -30) : v==='dia' ? isoAddDays(STATE.agenda.anchorDate,-1) : isoAddDays(STATE.agenda.anchorDate,-7);
      render();
      break;
    }
    case 'cal-next': {
      const v = STATE.agenda.view;
      STATE.agenda.anchorDate = v==='mes' ? isoAddDays(STATE.agenda.anchorDate, 30) : v==='dia' ? isoAddDays(STATE.agenda.anchorDate,1) : isoAddDays(STATE.agenda.anchorDate,7);
      render();
      break;
    }
    case 'toggle-day-closed': {
      const wasClosed = isDateClosed(d.date);
      const reason = wasClosed ? '' : val('gd_reason');
      toggleClosedDate(d.date, reason);
      MODAL_DIRTY = false;
      rerenderModalPreserveScroll();
      showToast(wasClosed ? 'Dia reaberto na agenda.' : 'Dia fechado — o tutor não poderá agendar nesta data.');
      if(remoteReady()){
        try{ await dbToggleClosedDate(d.date, reason, !wasClosed); }
        catch(err){ toggleClosedDate(d.date, reason); reportSaveError(err); }
      }
      break;
    }
    case 'toggle-slot-block': {
      const wasBlocked = DB.blockedSlots.some(b=>b.date===d.date && b.time===d.time);
      toggleBlockedSlot(d.date, d.time);
      MODAL_DIRTY = false;
      rerenderModalPreserveScroll();
      if(remoteReady()){
        try{ await dbToggleBlockedSlot(d.date, d.time, !wasBlocked); }
        catch(err){ toggleBlockedSlot(d.date, d.time); reportSaveError(err); }
      }
      break;
    }
    case 'block-range': {
      const from = val('gd_from'), to = val('gd_to');
      if(from && to && from < to){
        const slots = calSlotList().filter(t=>t>=from && t<to);
        blockSlotRange(d.date, from, to);
        showToast(`Horários de ${from} a ${to} bloqueados.`);
        if(remoteReady()){
          try{ await dbBlockSlotRange(d.date, slots); }
          catch(err){ reportSaveError(err); }
        }
      } else showToast('Selecione um intervalo válido (início antes do fim).', 'warn');
      MODAL_DIRTY = false;
      rerenderModalPreserveScroll();
      break;
    }
    case 'save-novo-agendamento': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const petId = val('na_pet'), date = val('na_date'), time = val('na_time');
      if(!isSlotFree(date, time, null)){
        showToast('Esse horário não está mais disponível.', 'warn');
        SAVE_LOCK = false; render(); break;
      }
      const appt = { id: uid('a'), petId, date, time, type: val('na_type')||'Consulta', modality: val('na_modality')||'Clínica', status:'Confirmado' };
      DB.appointments.push(appt);
      try{
        if(remoteReady()) await dbInsertAppointment(appt);
        showToast('Agendamento criado.');
        doCloseModal();
      } catch(err){
        DB.appointments = DB.appointments.filter(x=>x.id!==appt.id);
        reportSaveError(err); break;
      }
      render();
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-appt-time': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const a = DB.appointments.find(x=>x.id===d.apptId);
      const date = val('ad_date'), time = val('ad_time');
      if(!a){ SAVE_LOCK=false; break; }
      if(!isSlotFree(date, time, a.id)){ showToast('Esse horário não está disponível.', 'warn'); SAVE_LOCK=false; render(); break; }
      const prevDate=a.date, prevTime=a.time;
      a.date=date; a.time=time;
      try{
        if(remoteReady()) await dbUpdateAppointment(a.id, {date, time});
        showToast('Horário atualizado.');
        doCloseModal();
      } catch(err){ a.date=prevDate; a.time=prevTime; reportSaveError(err); break; }
      render();
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'cancel-appt': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const a = DB.appointments.find(x=>x.id===d.apptId);
      if(!a){ SAVE_LOCK=false; break; }
      const prev = a.status; a.status='Cancelado';
      try{
        if(remoteReady()) await dbUpdateAppointment(a.id, {status:'Cancelado'});
        showToast('Agendamento cancelado.');
        doCloseModal();
      } catch(err){ a.status=prev; reportSaveError(err); break; }
      render();
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }

    case 'close-modal': attemptCloseModal(); break;

    /* --- Itens dinâmicos: atendimento (exames/vacinas) --- */
    case 'add-at-exam': syncAtDraftFromDOM(); DRAFT_AT.exams.push({type:'',valor:'',obs:''}); rerenderModalPreserveScroll(); break;
    case 'remove-at-exam': syncAtDraftFromDOM(); DRAFT_AT.exams.splice(parseInt(d.idx),1); rerenderModalPreserveScroll(); break;
    case 'add-at-vaccine': syncAtDraftFromDOM(); DRAFT_AT.vaccines.push({name:'',date:'2026-09-01',batch:'',next:'2027-09-01',valor:''}); rerenderModalPreserveScroll(); break;
    case 'remove-at-vaccine': syncAtDraftFromDOM(); DRAFT_AT.vaccines.splice(parseInt(d.idx),1); rerenderModalPreserveScroll(); break;

    /* --- Itens dinâmicos: receita (medicamentos) --- */
    case 'add-rx-med': syncRxDraftFromDOM(); DRAFT_RX.meds.push({name:'',dosage:'',freq:'',duration:'',route:'Oral',orientations:''}); rerenderModalPreserveScroll(); break;
    case 'remove-rx-med': syncRxDraftFromDOM(); DRAFT_RX.meds.splice(parseInt(d.idx),1); if(!DRAFT_RX.meds.length) DRAFT_RX.meds.push({name:'',dosage:'',freq:'',duration:'',route:'Oral',orientations:''}); rerenderModalPreserveScroll(); break;

    case 'save-atendimento': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      syncAtDraftFromDOM();
      const b = DRAFT_AT;
      const petId = b.petId;
      const c = {
        id: uid('c'), petId, date: b.date || '2026-09-01',
        reason: b.reason || 'Consulta', anamnesis: b.anamnesis,
        weight: parseFloat(b.weight) || currentWeight(petId),
        temp: b.temp || '—', hr: b.hr || '—', rr: b.rr || '—',
        tpc: b.tpc, hidratacao: b.hidratacao, mucosas: b.mucosas, linfonodos: b.linfonodos,
        diagnosis: b.diagnosis || 'Sem alterações relevantes.',
        conduct: b.conduct || '—', notes:'',
        valor: parseFloat(b.valor) || 0,
      };
      const pet = getPet(petId);
      const prevWeight = pet.weight;
      const pendingPayments = [];
      const pendingExams = [];
      const pendingVaccines = [];

      try{
        if(remoteReady()) await dbInsertConsultation(c);
        DB.consultations.push(c);
        pet.weight = c.weight;
        if(remoteReady() && pet.weight !== prevWeight) await dbUpdatePet(petId, {weight: pet.weight});
        if(c.valor>0){
          const pay = createPayment({petId, date:c.date, service:'Consulta', valor:c.valor, refType:'consulta', refId:c.id});
          if(pay){ pendingPayments.push(pay); if(remoteReady()) await dbInsertPayment(pay); }
        }

        for(const ex of b.exams){
          if(!ex.type) continue;
          const rec = { id: uid('e'), petId, date: c.date, type: ex.type, valor: parseFloat(ex.valor)||0, description: ex.obs||'', result:'', observacoes:'', anexo:'', status:'Solicitado' };
          if(remoteReady()) await dbInsertExam(rec);
          DB.exams.push(rec); pendingExams.push(rec);
          if(rec.valor>0){
            const pay = createPayment({petId, date:c.date, service:`Exame — ${rec.type}`, valor:rec.valor, refType:'exame', refId:rec.id});
            if(pay && remoteReady()) await dbInsertPayment(pay);
          }
        }
        for(const vc of b.vaccines){
          if(!vc.name) continue;
          const rec = { id: uid('v'), petId, vaccine: vc.name, date: vc.date||c.date, batch: vc.batch||'—', nextDate: vc.next||'2027-09-01', valor: parseFloat(vc.valor)||0, notes:'' };
          if(remoteReady()) await dbInsertVaccine(rec);
          DB.vaccines.push(rec); pendingVaccines.push(rec);
          if(rec.valor>0){
            const pay = createPayment({petId, date:rec.date, service:`Vacina — ${rec.vaccine}`, valor:rec.valor, refType:'vacina', refId:rec.id});
            if(pay && remoteReady()) await dbInsertPayment(pay);
          }
        }

        DRAFT_AT = null;
        doCloseModal();
        showToast(`Atendimento salvo${pendingExams.length?` · ${pendingExams.length} exame(s)`:''}${pendingVaccines.length?` · ${pendingVaccines.length} vacina(s)`:''}.`);
        navigate('vet-pet-detail', {petId});
      } catch(err){
        reportSaveError(err); break;
      }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-receita': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      syncRxDraftFromDOM();
      const petId = DRAFT_RX.petId;
      const meds = DRAFT_RX.meds.filter(m=>m.name).map(m=>({ name:m.name, dosage:m.dosage||'—', freq:m.freq||'—', duration:m.duration||'—', route:m.route||'Oral', orientations:m.orientations||'' }));
      const r = { id: uid('r'), petId, date: DRAFT_RX.date || '2026-09-01', meds: meds.length?meds:[{name:'Medicamento',dosage:'—',freq:'—',duration:'—',route:'Oral',orientations:''}], orientations:'' };
      try{
        if(remoteReady()) await dbInsertPrescription(r);
        DB.prescriptions.push(r);
        DRAFT_RX = null;
        doCloseModal();
        showToast(`Receita gerada com ${r.meds.length} medicamento${r.meds.length>1?'s':''}.`);
        navigate('vet-pet-detail', {petId});
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-exame': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const petId = val('ex_pet');
      const valor = num('ex_valor');
      const ex = { id: uid('e'), petId, date: val('ex_date') || '2026-09-01', type: val('ex_type')||'Exame', valor, description: val('ex_desc'), result:'', observacoes:'', anexo:'', status:'Solicitado' };
      try{
        if(remoteReady()) await dbInsertExam(ex);
        DB.exams.push(ex);
        if(valor>0){
          const pay = createPayment({petId, date:ex.date, service:`Exame — ${ex.type}`, valor, refType:'exame', refId:ex.id});
          if(pay && remoteReady()) await dbInsertPayment(pay);
        }
        doCloseModal();
        showToast('Exame registrado — status "Solicitado".');
        navigate('vet-pet-detail', {petId});
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-vacina': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const petId = val('vc_pet');
      const valor = num('vc_valor');
      const v = { id: uid('v'), petId, vaccine: val('vc_name')||'Vacina', date: val('vc_date')||'2026-09-01', batch: val('vc_batch')||'—', nextDate: val('vc_next')||'2027-09-01', valor, notes: val('vc_notes') };
      try{
        if(remoteReady()) await dbInsertVaccine(v);
        DB.vaccines.push(v);
        if(valor>0){
          const pay = createPayment({petId, date:v.date, service:`Vacina — ${v.vaccine}`, valor, refType:'vacina', refId:v.id});
          if(pay && remoteReady()) await dbInsertPayment(pay);
        }
        doCloseModal();
        showToast('Vacinação registrada.');
        navigate('vet-pet-detail', {petId});
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'iniciar-exame': {
      const ex = DB.exams.find(x=>x.id===d.examId);
      if(!ex) break;
      const prev = ex.status; ex.status='Em andamento'; render();
      if(remoteReady()){
        try{ await dbUpdateExam(ex.id, {status:'Em andamento'}); showToast('Exame iniciado.'); }
        catch(err){ ex.status = prev; reportSaveError(err); }
      } else showToast('Exame iniciado.');
      break;
    }
    case 'save-concluir-exame': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const ex = DB.exams.find(x=>x.id===d.examId);
      if(!ex){ SAVE_LOCK=false; break; }
      const fields = {
        result: val('ce_result') || 'Resultado sem alterações relevantes.',
        observacoes: val('ce_obs'),
        anexo: ex.anexo || `${ex.type.toLowerCase().replace(/\s+/g,'_')}.pdf`,
        status: 'Resultado disponível',
      };
      try{
        if(remoteReady()) await dbUpdateExam(ex.id, fields);
        Object.assign(ex, fields);
        doCloseModal();
        showToast('Exame concluído — resultado disponível para o tutor.');
        navigate('vet-pet-detail', {petId: ex.petId});
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }

    case 'save-novo-pet': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const id = uid('p');
      const species = val('np_species') || 'Cachorro';
      const p = { id, name: val('np_name')||'Novo pet', species, breed: val('np_breed')||'SRD', sex: val('np_sex')||'Fêmea', birth: val('np_birth')||'2023-01-01', weight: parseFloat(val('np_weight'))||1, microchip: val('np_chip'), notes: val('np_notes'), tutorId: val('np_tutor')||DB.tutors[0].id };
      try{
        if(remoteReady()) await dbInsertPet(p);
        DB.pets.push(p);
        const tt = getTutor(p.tutorId); if(tt && !tt.pets.includes(id)) tt.pets.push(id);
        doCloseModal();
        showToast('Pet cadastrado com sucesso.');
        navigate('vet-pet-detail', {petId: id});
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-novo-pet-tutor': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const id = uid('p');
      const species = val('nptu_species') || 'Cachorro';
      const tutorId = STATE.currentTutorId;
      const p = { id, name: val('nptu_name')||'Meu pet', species, breed: val('nptu_breed')||'SRD', sex: val('nptu_sex')||'Fêmea', birth: val('nptu_birth')||'2023-01-01', weight: parseFloat(val('nptu_weight'))||1, microchip: val('nptu_chip'), notes: val('nptu_notes'), tutorId };
      try{
        if(remoteReady()) await dbInsertPet(p);
        DB.pets.push(p);
        const tt = getTutor(tutorId); if(tt && !tt.pets.includes(id)) tt.pets.push(id);
        doCloseModal();
        showToast('Pet cadastrado com sucesso!');
        navigate('tutor-pet-detail', {petId: id});
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-novo-tutor': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const id = uid('t');
      const t = { id, name: val('nt_name')||'Novo tutor', phone: val('nt_phone')||'—', email: val('nt_email')||'—', pets: [] };
      try{
        if(remoteReady()) await dbInsertTutor(t);
        DB.tutors.push(t);
        doCloseModal();
        showToast('Tutor cadastrado com sucesso.');
        navigate('vet-tutores');
      } catch(err){ reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'save-edit-pet': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const p = getPet(d.petId);
      if(!p){ SAVE_LOCK=false; break; }
      const fields = { name: val('ep_name')||p.name, breed: val('ep_breed')||p.breed, weight: parseFloat(val('ep_weight'))||p.weight, sex: val('ep_sex')||p.sex, notes: val('ep_notes'), birth: val('ep_birth')||p.birth };
      const prev = { name:p.name, breed:p.breed, weight:p.weight, sex:p.sex, notes:p.notes, birth:p.birth };
      Object.assign(p, fields);
      try{
        if(remoteReady()) await dbUpdatePet(p.id, fields);
        doCloseModal();
        showToast('Alterações salvas.');
        navigate('vet-pet-detail', {petId: p.id});
      } catch(err){ Object.assign(p, prev); reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }

    case 'open-confirm-delete-pet': STATE.confirmDeletePetId = d.petId; render(); break;
    case 'cancel-delete-pet': STATE.confirmDeletePetId = null; render(); break;
    case 'confirm-delete-pet': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const petId = d.petId;
      try{
        if(remoteReady()) await dbDeletePet(petId);
        DB.pets = DB.pets.filter(p=>p.id!==petId);
        DB.consultations = DB.consultations.filter(c=>c.petId!==petId);
        DB.exams = DB.exams.filter(e=>e.petId!==petId);
        DB.vaccines = DB.vaccines.filter(v=>v.petId!==petId);
        DB.prescriptions = DB.prescriptions.filter(r=>r.petId!==petId);
        DB.payments = DB.payments.filter(p=>p.petId!==petId);
        DB.appointments = DB.appointments.filter(a=>a.petId!==petId);
        DB.tutors.forEach(t=>{ t.pets = t.pets.filter(id=>id!==petId); });
        STATE.confirmDeletePetId = null;
        doCloseModal();
        showToast('Pet excluído.');
        navigate(STATE.role==='vet' ? 'vet-pets' : 'tutor-pets');
      } catch(err){ STATE.confirmDeletePetId = null; reportSaveError(err); break; }
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }

    case 'filter-timeline': STATE.petFilter = d.filter; render(); break;
    case 'finance-filter': STATE.financeFilter = d.filter; render(); break;

    case 'confirm-appt': {
      const a = DB.appointments.find(x=>x.id===d.apptId);
      if(!a) break;
      const prev = a.status; a.status='Confirmado'; doCloseModal();
      if(remoteReady()){
        try{ await dbUpdateAppointment(a.id, {status:'Confirmado'}); showToast('Atendimento confirmado.'); }
        catch(err){ a.status = prev; reportSaveError(err); }
      } else showToast('Atendimento confirmado.');
      render();
      break;
    }
    case 'complete-appt': {
      const a = DB.appointments.find(x=>x.id===d.apptId);
      if(!a) break;
      const prev = a.status; a.status='Realizado'; doCloseModal();
      if(remoteReady()){
        try{ await dbUpdateAppointment(a.id, {status:'Realizado'}); showToast('Atendimento marcado como realizado.'); }
        catch(err){ a.status = prev; reportSaveError(err); }
      } else showToast('Atendimento marcado como realizado.');
      render();
      break;
    }

    case 'save-recusar-agendamento': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const a = DB.appointments.find(x=>x.id===d.apptId);
      if(!a){ SAVE_LOCK=false; break; }
      const suggestions = suggestSlots(a.date, a.id, 3);
      const prevStatus = a.status, prevSlots = a.proposedSlots;
      a.status = 'Recusado'; a.proposedSlots = suggestions;
      try{
        if(remoteReady()) await dbUpdateAppointment(a.id, {status:'Recusado', proposedSlots: suggestions});
        showToast('Agendamento recusado. Sugestões enviadas ao tutor.', 'warn');
        doCloseModal();
      } catch(err){ a.status = prevStatus; a.proposedSlots = prevSlots; reportSaveError(err); break; }
      render();
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'pick-suggested-slot': {
      const a = DB.appointments.find(x=>x.id===d.apptId);
      if(!a) break;
      const prevDate=a.date, prevTime=a.time, prevStatus=a.status, prevSlots=a.proposedSlots;
      a.date = d.date; a.time = d.time; a.status='Confirmado'; a.proposedSlots=null;
      render();
      if(remoteReady()){
        try{ await dbUpdateAppointment(a.id, {date:d.date, time:d.time, status:'Confirmado', proposedSlots:null}); showToast('Agendamento confirmado 🐾'); }
        catch(err){ a.date=prevDate; a.time=prevTime; a.status=prevStatus; a.proposedSlots=prevSlots; reportSaveError(err); }
      } else showToast('Agendamento confirmado 🐾');
      break;
    }

    case 'pay-pick-forma': { if(DRAFT_PAY) DRAFT_PAY.forma = d.forma; rerenderModalPreserveScroll(); break; }
    case 'pay-change-parcelas': { if(DRAFT_PAY) DRAFT_PAY.parcelas = Math.max(1, parseInt(val('pay_parcelas'))||1); rerenderModalPreserveScroll(); break; }
    case 'save-registrar-pagamento': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      if(DRAFT_PAY && DRAFT_PAY.payIds && DRAFT_PAY.payIds.length){
        const ids = DRAFT_PAY.payIds, forma = DRAFT_PAY.forma, parcelas = DRAFT_PAY.parcelas;
        const total = ids.reduce((s,id)=>{ const p=DB.payments.find(x=>x.id===id); return s+(p?p.valor:0); },0);
        const paidDate = NOW_ISO_DATE;
        try{
          if(remoteReady()) await dbUpdatePaymentsStatus(ids, forma, parcelas, paidDate);
          registerFullPayment(ids, forma, parcelas, paidDate);
          showToast(`Pagamento de ${fmtMoney(total)} confirmado — status Pago.`);
        } catch(err){ DRAFT_PAY=null; reportSaveError(err); break; }
      }
      DRAFT_PAY = null;
      doCloseModal();
      render();
      setTimeout(()=>{ SAVE_LOCK = false; }, 0);
      break;
    }

    case 'save-settings': showToast('Perfil atualizado.'); break;
    case 'toggle-switch': actionEl.classList.toggle('on'); break;

    case 'agend-pick-pet': STATE.booking.petId = d.petId; render(); break;
    case 'agend-pick-service': STATE.booking.service = d.service; render(); break;
    case 'agend-pick-modality': STATE.booking.modality = d.modality; render(); break;
    case 'agend-pick-date': STATE.booking.date = d.date; STATE.booking.time = null; render(); break;
    case 'agend-pick-time': STATE.booking.time = d.time; render(); break;
    case 'agend-next': STATE.booking.step = (STATE.booking.step||1) + 1; render(); break;
    case 'agend-back': {
      if(STATE.booking.step > 1){ STATE.booking.step--; render(); }
      else { navigate('tutor-agenda'); }
      break;
    }
    case 'agend-confirm': {
      if(SAVE_LOCK) break; SAVE_LOCK = true;
      const b = STATE.booking;
      const appt = { id: uid('a'), petId: b.petId, date: b.date, time: b.time, type: b.service, modality: b.modality, status: 'Aguardando confirmação' };
      try{
        if(remoteReady()) await dbInsertAppointment(appt);
        DB.appointments.push(appt);
        STATE.booking.step = 6;
      } catch(err){ reportSaveError(err); break; }
      render();
      setTimeout(()=>{ SAVE_LOCK=false; },0);
      break;
    }
    case 'agend-finish': {
      STATE.booking = { step:1, petId:null, service:null, modality:null, date:null, time:null };
      navigate('tutor-dashboard');
      break;
    }
  }
});

/* ---------- Bootstrap ----------
   Se supabase-client.js carregar normalmente, ele mesmo chama render()
   depois de checar login/dados. Este é só um seguro: se por algum motivo
   aquele arquivo não carregar (bloqueio de rede, CDN fora do ar...), a
   página não fica em branco — ainda assim mostra o app em modo demonstração. */
window.addEventListener('load', function(){
  if(!window.__petflowBooted){ window.__petflowBooted = true; render(); }
});

</script>
<!-- Ponte com o Supabase (opcional): enquanto SUPABASE_URL não for
     preenchida em supabase-client.js, o app roda 100% com os dados
     de demonstração locais, exatamente como antes. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
</body>
</html>
